# Builds Resonance and publishes a GitHub release when a version tag is pushed (e.g. v1.1.0).
# Resonance's "Updates" setting compares the newest release here with the installed version.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The release notes are the tag's message (Publish-to-GitHub.bat writes the list of changes there).
      # Resonance shows them in its "What's new" card after updating.
      - name: Release notes
        id: notes
        shell: bash
        run: |
          git fetch --tags --force --quiet
          NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          {
            echo 'body<<END_OF_NOTES'
            if [ -n "$NOTES" ]; then echo "$NOTES"; echo; fi
            echo '---'
            echo 'Download Resonance_*_x64-setup.exe below and run it. Windows may show a SmartScreen warning because the installer is not code-signed: choose "More info", then "Run anyway".'
            echo 'END_OF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (optional): see docs/CODE-SIGNING.md and add your provider's secrets here, e.g.
          # AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          # AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Resonance ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
