[package]
name = "resonance"
version = "1.1.2"
description = "A desktop player for YouTube Music"
repository = "https://github.com/PoisonTheIgiData/Ressonance-YT-Music"
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
discord-rich-presence = "1.1"
semver = "1"
qrcodegen = "1.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Bluetooth radio, connected devices / battery and audio outputs (src/devices.rs);
# webview2-com: low-memory mode while hidden (same version Tauri uses)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Devices_Radios", "Devices_Bluetooth", "Devices_Enumeration", "Foundation", "Foundation_Collections",
  "Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties", "Win32_Devices_FunctionDiscovery",
] }
