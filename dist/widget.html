<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Resonance mini player</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  #bubble { position: absolute; bottom: 0; display: none; }
  /* Bluetooth / audio bubble — same shape & colors as the player next to it */
  .wb { justify-content: center; gap: 4px; padding: 0 9px; cursor: pointer; }
  .wb svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
  .wb .wb-p { font: 700 12.5px/1 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .wb .wb-p:empty { display: none; }
  .wb.off { opacity: .62; }
  .wb.low .wb-p { color: #ff4d4d; }
  .wb:hover { filter: brightness(1.08); }
  .wb:active { transform: scale(.96); }
  .wb { transition: transform .12s, filter .15s, background .6s, opacity .2s; }
  /* the panel above the bubble */
  #panel { position: absolute; display: none; box-sizing: border-box; width: 290px; max-height: 420px; overflow-y: auto; padding: 8px; border-radius: 14px;
    background: linear-gradient(180deg, rgba(var(--rw-tint, 255,72,108), .30), rgba(22,22,28,.985) 120px), #16161c; color: #f4f4f7;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); font: 13px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none; scrollbar-width: thin; animation: up .16s cubic-bezier(.2,.8,.2,1); }
  @keyframes up { from { opacity: 0; transform: translateY(8px); } }
  #panel svg { fill: currentColor; }
  .dv-head { display: flex; align-items: center; gap: 11px; padding: 6px 6px 8px; }
  .dv-ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); color: #a3a3b0; flex: none; }
  .dv-ic.on { background: rgba(var(--rw-tint, 255,72,108), .35); color: #fff; }
  .dv-ic svg { width: 19px; height: 19px; }
  .dv-hm { flex: 1; min-width: 0; }
  .dv-t { font-weight: 700; font-size: 13.5px; }
  .dv-s { font-size: 12px; color: #a3a3b0; margin-top: 1px; }
  .sw { width: 40px; height: 22px; border-radius: 99px; border: 0; padding: 0; background: #3a3a44; position: relative; cursor: pointer; flex: none; transition: background .2s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s cubic-bezier(.2,.8,.2,1); }
  .sw.on { background: #ff486c; } .sw.on::after { transform: translateX(18px); }
  .sw:disabled { opacity: .5; cursor: default; }
  .dv-sec { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #8b8b98; padding: 10px 8px 4px; border-top: 1px solid rgba(255,255,255,.08); margin-top: 4px; }
  .dv-row { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 4px 8px; border-radius: 8px; width: 100%; box-sizing: border-box; text-align: left;
    background: none; border: 0; color: #e6e6ec; font: inherit; font-size: 13px; }
  .dv-ri { width: 20px; display: grid; place-items: center; color: #a3a3b0; flex: none; }
  .dv-ri svg { width: 18px; height: 18px; }
  .dv-n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dv-nob { font-size: 11.5px; color: #8b8b98; }
  button.dv-row { cursor: pointer; transition: background .12s; }
  button.dv-row:hover { background: rgba(255,255,255,.09); }
  .dv-row.on { color: #fff; font-weight: 650; }
  .dv-row.on .dv-ri, .dv-ck { color: #ff486c; }
  .dv-ck { width: 18px; display: grid; place-items: center; flex: none; }
  .dv-ck svg { width: 17px; height: 17px; }
  .dv-empty { font-size: 12.5px; color: #8b8b98; padding: 10px 8px; }
  .batt { position: relative; width: 22px; height: 11px; border: 1.5px solid #a3a3b0; border-radius: 3px; flex: none; box-sizing: border-box; }
  .batt::after { content: ""; position: absolute; right: -4px; top: 2.5px; width: 2px; height: 3px; border-radius: 0 1px 1px 0; background: #a3a3b0; }
  .batt i { position: absolute; left: 1px; top: 1px; bottom: 1px; max-width: calc(100% - 2px); border-radius: 1px; background: #e8e8ee; }
  .batt.low i { background: #ff5d5d; }
  .batt-t { font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; min-width: 32px; text-align: right; }
  .batt.low + .batt-t { color: #ff5d5d; }
</style>
<script src="widget-render.js"></script>
</head>
<body>
  <div id="root"></div>
  <div id="bubble" class="rw pill tint wb" title=""></div>
  <div id="panel"></div>
<script>
  // no browser right-click menu (Back / Refresh / Inspect…) on the taskbar player
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'F5' || (e.ctrlKey && /^[rpsfu]$/i.test(e.key))) e.preventDefault();
    if (e.key === 'Escape') closePanel(true);
  });
  const css = document.createElement('style');
  css.textContent = ResWidget.CSS;
  document.head.appendChild(css);

  const invoke = (cmd, args) => { try { return window.__TAURI_INTERNALS__.invoke(cmd, args); } catch (e) {} };
  const send = (c) => invoke('res_widget_cmd', { cmd: c });
  const handlers = {
    cmd: (c) => { send(c); if (c === 'toggle' && last) { last.playing = !last.playing; inst.update(last); } },
    show: () => send('show'),
    seek: (f) => send('seek:' + f.toFixed(4)),
  };
  const $root = document.getElementById('root'), $bubble = document.getElementById('bubble'), $panel = document.getElementById('panel');
  let layout = ResWidget.PRESETS[0];
  let last = null;
  let inst = ResWidget.mount($root, layout, handlers);

  // ----- icons (Material, 24×24) -----
  const NS = 'http://www.w3.org/2000/svg';
  const P = {
    bt: 'M17.71 7.71 12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z',
    btConn: 'M7 12l-2-2-2 2 2 2 2-2zm10.71-4.29L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88zM19 10l-2 2 2 2 2-2-2-2z',
    btOff: 'M13 5.83l1.88 1.88-1.6 1.6 1.41 1.41 3.02-3.02L12 2h-1v5.03l2 2v-3.2zM5.41 4 4 5.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l4.29-4.29 2.3 2.29L20 18.59 5.41 4zM13 18.17v-3.76l1.88 1.88L13 18.17z',
    speaker: 'M17 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-5 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm0 16a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
    headphones: 'M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h4v-8H5v-1a7 7 0 0 1 14 0v1h-4v8h4a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z',
    monitor: 'M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5v2h8v-2h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 14H3V5h18v12z',
    mouse: 'M13 1.07V9h7c0-4.08-3.05-7.44-7-7.93zM4 15a8 8 0 0 0 16 0v-4H4v4zm7-13.93C7.05 1.56 4 4.92 4 9h7V1.07z',
    phone: 'M17 1.01 7 1a2 2 0 0 0-2 2v18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3a2 2 0 0 0-2-1.99zM17 19H7V5h10v14z',
    devices: 'M4 6h18V4H4a2 2 0 0 0-2 2v11H0v3h14v-3H4V6zm19 2h-6a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1zm-1 9h-4v-7h4v7z',
    check: 'M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',
  };
  const svg = (n) => { const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', '0 0 24 24'); const p = document.createElementNS(NS, 'path'); p.setAttribute('d', P[n] || ''); s.appendChild(p); return s; };
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

  // ----- Bluetooth / audio output -----
  let bubbleKey = '', want = '', dev = null, busy = '', busyAt = 0, panelOpen = false, geom = null, bubbleW = -1, panelH = 0;
  const DEV_IC = { audio: 'headphones', input: 'mouse', phone: 'phone', other: 'devices' };
  const isHeadset = (n) => /\b(head(phones?|set)|ear(phones?|buds?)|buds|air ?pods|słuchawki|kopfhörer|casque|auriculares|cuffie|hands-free)\b/i.test(n || '');
  const outIc = (o) => (/hdmi|displayport|display audio|monitor|\btv\b|nvidia|amd high definition|intel\(r\) display/i.test(o.name) && !o.bt ? 'monitor' : o.bt || isHeadset(o.name) ? 'headphones' : 'speaker');
  function summary() {
    if (!dev) return null;
    const def = (dev.outputs || []).find((o) => o.default);
    if (dev.bt === 'none') return { icon: def ? outIc(def) : 'speaker', pct: null, cls: '', title: 'Audio output: ' + (def ? def.name : 'system default') };
    if (dev.bt === 'off') return { icon: 'btOff', pct: null, cls: 'off', title: 'Bluetooth is off' };
    const p = (dev.devices || [])[0];
    if (!p) return { icon: 'bt', pct: null, cls: '', title: 'Bluetooth on · nothing connected' };
    return { icon: 'btConn', pct: p.battery, cls: p.battery != null && p.battery <= 20 ? 'low' : '', title: p.name + (p.battery != null ? ' · ' + p.battery + '% battery' : ' · connected') };
  }
  function paintBubble() {
    const sm = summary();
    const want = sm ? (sm.pct != null ? 66 : 40) : 0;
    if (want !== bubbleW) { bubbleW = want; send('bubble:' + want); }
    if (!sm) { $bubble.style.display = 'none'; closePanel(false); bubbleKey = ''; return; }
    const box0 = $root.querySelector('.rw');
    const key = [sm.icon, sm.pct, sm.cls, sm.title, layout.shape, layout.bg, box0 ? box0.style.cssText : ''].join('|');
    if (key === bubbleKey) return; // nothing changed (the player pushes its state every few seconds)
    bubbleKey = key;
    while ($bubble.firstChild) $bubble.removeChild($bubble.firstChild);
    $bubble.appendChild(svg(sm.icon));
    $bubble.appendChild(el('span', 'wb-p', sm.pct != null ? sm.pct + '%' : ''));
    $bubble.title = sm.title + ' — click for Bluetooth & audio output';
    $bubble.className = 'rw ' + layout.shape + ' ' + layout.bg + ' wb' + (sm.cls ? ' ' + sm.cls : '');
    const box = $root.querySelector('.rw');
    if (box) for (const v of ['--rw-tint', '--rw-fg', '--rw-dim']) { const x = box.style.getPropertyValue(v); if (x) { $bubble.style.setProperty(v, x); $panel.style.setProperty(v, x); } }
  }
  function battery(b) {
    const f = document.createDocumentFragment();
    const bt = el('span', 'batt' + (b <= 20 ? ' low' : '')); const i = el('i'); i.style.width = Math.max(8, Math.min(100, b)) + '%'; bt.appendChild(i);
    f.appendChild(bt); f.appendChild(el('span', 'batt-t', b + '%'));
    return f;
  }
  function buildPanel() {
    while ($panel.firstChild) $panel.removeChild($panel.firstChild);
    if (!dev) { $panel.appendChild(el('div', 'dv-empty', 'Looking for devices…')); return; }
    if (dev.bt !== 'none') {
      const on = dev.bt === 'on', n = (dev.devices || []).length;
      const head = el('div', 'dv-head');
      const icw = el('div', 'dv-ic' + (on ? ' on' : '')); icw.appendChild(svg(on ? (n ? 'btConn' : 'bt') : 'btOff')); head.appendChild(icw);
      const hm = el('div', 'dv-hm'); hm.appendChild(el('div', 'dv-t', 'Bluetooth'));
      hm.appendChild(el('div', 'dv-s', busy || (on ? (n ? n + (n > 1 ? ' devices' : ' device') + ' connected' : 'On · nothing connected') : 'Off')));
      head.appendChild(hm);
      const sw = el('button', 'sw' + (on ? ' on' : '')); sw.title = 'Turn Bluetooth ' + (on ? 'off' : 'on'); sw.disabled = !!busy;
      sw.onclick = () => { busy = on ? 'Turning off…' : 'Turning on…'; busyAt = Date.now(); want = on ? 'off' : 'on'; send(on ? 'bt:off' : 'bt:on'); refreshPanel(); setTimeout(() => { if (busy) { busy = ''; refreshPanel(); } }, 8000); };
      head.appendChild(sw);
      $panel.appendChild(head);
      if (on && n) {
        for (const d of dev.devices) {
          const r = el('div', 'dv-row'); const ri = el('span', 'dv-ri'); ri.appendChild(svg(DEV_IC[d.kind] || 'devices')); r.appendChild(ri);
          const nm = el('span', 'dv-n', d.name); nm.title = d.name; r.appendChild(nm);
          if (d.battery == null) r.appendChild(el('span', 'dv-nob', 'Connected')); else r.appendChild(battery(d.battery));
          $panel.appendChild(r);
        }
      }
    }
    $panel.appendChild(el('div', 'dv-sec', 'Audio output'));
    const outs = dev.outputs || [];
    if (!outs.length) $panel.appendChild(el('div', 'dv-empty', 'No audio outputs found'));
    for (const o of outs) {
      const b = el('button', 'dv-row' + (o.default ? ' on' : '')); b.title = o.name;
      const ri = el('span', 'dv-ri'); ri.appendChild(svg(outIc(o))); b.appendChild(ri);
      b.appendChild(el('span', 'dv-n', o.name));
      const ck = el('span', 'dv-ck'); if (o.default) ck.appendChild(svg('check')); b.appendChild(ck);
      b.onclick = () => { if (o.default) return; outs.forEach((x) => (x.default = x === o)); send('out:' + o.id); refreshPanel(); paintBubble(); };
      $panel.appendChild(b);
    }
    const first = $panel.querySelector('.dv-head + .dv-sec, .dv-sec:first-child');
    if (first && first === $panel.firstChild) first.style.borderTop = '0';
  }
  function measure() {
    const shown = $panel.style.display === 'block';
    if (!shown) { $panel.style.visibility = 'hidden'; $panel.style.display = 'block'; }
    const h = Math.min(420, Math.ceil($panel.scrollHeight));
    if (!shown) { $panel.style.display = 'none'; $panel.style.visibility = ''; }
    return h;
  }
  function refreshPanel() {
    if (!panelOpen) return;
    buildPanel();
    const h = measure();
    if (Math.abs(h - panelH) > 1) { panelH = h; send('panel:290x' + h); }
  }
  function openPanel() {
    if (!dev) return;
    panelOpen = true;
    buildPanel();
    panelH = measure();
    send('dev:refresh');
    send('panel:290x' + panelH);
  }
  function closePanel(notify) {
    if (!panelOpen) return;
    panelOpen = false; panelH = 0;
    $panel.style.display = 'none';
    if (notify) send('panel:0');
  }
  $bubble.addEventListener('click', (e) => { e.stopPropagation(); panelOpen ? closePanel(true) : openPanel(); });
  $bubble.addEventListener('wheel', (e) => { e.preventDefault(); handlers.cmd(e.deltaY < 0 ? 'volUp' : 'volDown'); }, { passive: false });
  window.addEventListener('blur', () => closePanel(true));

  // ----- placement inside the (transparent) window, decided by Resonance -----
  window.resGeom = (g) => {
    geom = g;
    $root.style.left = g.player.x + 'px'; $root.style.width = g.player.w + 'px'; $root.style.right = 'auto';
    $root.style.top = 'auto'; $root.style.height = g.bar + 'px';
    if (g.bubble && dev) {
      Object.assign($bubble.style, { display: 'flex', left: g.bubble.x + 'px', width: g.bubble.w + 'px', height: g.bar + 'px' });
    } else $bubble.style.display = 'none';
    if (g.panel && panelOpen && g.bubble) {
      $panel.style.bottom = (g.bar + 6) + 'px';
      if (g.side === 'left') { $panel.style.left = g.bubble.x + 'px'; $panel.style.right = 'auto'; }
      else { $panel.style.right = Math.max(0, innerWidth - g.bubble.x - g.bubble.w) + 'px'; $panel.style.left = 'auto'; }
      $panel.style.display = 'block';
    } else if (!g.panel) $panel.style.display = 'none';
    inst.marquee();
  };
  window.resPanel = (open) => { if (!open) closePanel(false); };
  window.resDev = (st) => {
    if (st && busy && (st.bt === want || st.error || Date.now() - busyAt > 5000)) busy = '';
    dev = st || null;
    paintBubble();
    if (geom) window.resGeom(geom);
    refreshPanel();
  };

  window.resLayout = (l) => {
    layout = ResWidget.normalize(l);
    inst.destroy();
    inst = ResWidget.mount($root, layout, handlers);
    if (last) inst.update(last);
    paintBubble();
  };
  window.resUpdate = (s) => { if (!s) return; last = s; inst.update(s); if (dev) paintBubble(); };
  window.addEventListener('resize', () => inst.marquee());
  send('sync');
</script>
</body>
</html>
