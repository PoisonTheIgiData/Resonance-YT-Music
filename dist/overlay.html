<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Resonance now playing</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  /* colours, light/dark and corners follow Resonance's theme (resTheme) */
  :root { --ob: #16161c; --ot: #fff; --om: rgba(255,255,255,.66); --ol: rgba(255,255,255,.12); --or: 16px; --og: .55; }
  body.light { --og: .3; }
  .ov { position: absolute; inset: 0; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: var(--or); cursor: pointer;
    background: linear-gradient(105deg, rgba(var(--t, 124,58,237), var(--og)), var(--ob) 62%), var(--ob); color: var(--ot);
    box-shadow: inset 0 0 0 1px var(--ol); font: 13px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    opacity: 0; transform: translateY(10px) scale(.98); transition: opacity .35s cubic-bezier(.2,.8,.2,1), transform .35s cubic-bezier(.2,.8,.2,1); overflow: hidden; }
  .ov.in { opacity: 1; transform: none; }
  .art { width: 60px; height: 60px; border-radius: max(4px, calc(var(--or) - 6px)); background: #2a2a33 center/cover no-repeat; flex: none; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  .meta { flex: 1; min-width: 0; }
  .k { font-size: 10.5px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; color: var(--om); display: flex; align-items: center; gap: 6px; }
  .k i { width: 6px; height: 6px; border-radius: 50%; background: #ff486c; box-shadow: 0 0 8px #ff486c; }
  .t { font-size: 15px; font-weight: 750; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .a { color: var(--om); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--om); transform-origin: left; }
  .ov.in .prog { animation: shrink var(--d, 5s) linear forwards; }
  .ov:hover .prog { animation-play-state: paused; }
  @keyframes shrink { to { transform: scaleX(0); } }
</style>
</head>
<body>
  <div class="ov" id="ov" title="Open Resonance">
    <div class="art" id="art"></div>
    <div class="meta"><div class="k"><i></i>Now playing</div><div class="t" id="t"></div><div class="a" id="a"></div></div>
    <div class="prog" id="prog"></div>
  </div>
<script>
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  const invoke = (cmd, args) => { try { return window.__TAURI_INTERNALS__.invoke(cmd, args); } catch (e) {} };
  const ov = document.getElementById('ov');
  let hideT = 0, hovering = false, dur = 5000, shownAt = 0, left = 0;
  function hide() { ov.classList.remove('in'); setTimeout(() => invoke('res_widget_cmd', { cmd: 'overlay:hide' }), 380); }
  function arm(ms) { clearTimeout(hideT); hideT = setTimeout(() => { if (!hovering) hide(); }, ms); }
  window.resTheme = (t) => {
    if (!t) return;
    const r = document.documentElement.style, m = { bg: '--ob', text: '--ot', muted: '--om', line: '--ol' };
    for (const k in m) if (t[k]) r.setProperty(m[k], t[k]);
    if (t.rad) r.setProperty('--or', 'calc(' + t.rad + ' + 4px)');
    document.body.classList.toggle('light', !!t.light);
  };
  window.resOverlay = (s) => {
    document.getElementById('t').textContent = s.title || '';
    document.getElementById('a').textContent = s.artist || '';
    document.getElementById('art').style.backgroundImage = s.art ? 'url("' + String(s.art).replace(/"/g, '%22') + '")' : 'none';
    if (Array.isArray(s.tint)) ov.style.setProperty('--t', s.tint.join(','));
    dur = Math.max(2000, Math.min(15000, Number(s.ms) || 5000));
    ov.style.setProperty('--d', dur / 1000 + 's');
    ov.classList.remove('in'); void ov.offsetWidth; // restart the animation
    requestAnimationFrame(() => ov.classList.add('in'));
    shownAt = Date.now(); arm(dur);
  };
  ov.addEventListener('mouseenter', () => { hovering = true; left = Math.max(1200, dur - (Date.now() - shownAt)); clearTimeout(hideT); });
  ov.addEventListener('mouseleave', () => { hovering = false; shownAt = Date.now() - (dur - left); arm(left); });
  ov.addEventListener('click', () => { invoke('res_widget_cmd', { cmd: 'show' }); hide(); });
</script>
</body>
</html>
